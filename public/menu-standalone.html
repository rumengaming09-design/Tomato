      t.workingHours.forEach(line => {
        const p = document.createElement('p');
        p.textContent = line;
        hoursList.appendChild(p);
      });
      
      // Refresh content
      renderContent();
    }

    function showSection(section) {
      currentSection = section;
      
      // Update tabs
      const tabDrinks = document.getElementById('tabDrinks');
      const tabFood = document.getElementById('tabFood');
      
      if (section === 'drinks') {
        tabDrinks.className = "px-6 md:px-10 py-3 md:py-4 border text-[9px] md:text-[10px] uppercase tracking-[0.2em] md:tracking-[0.3em] font-black transition-all bg-jazz-gold text-black border-jazz-gold";
        tabFood.className = "px-6 md:px-10 py-3 md:py-4 border text-[9px] md:text-[10px] uppercase tracking-[0.2em] md:tracking-[0.3em] font-black transition-all bg-transparent text-white border-white/20 hover:border-jazz-gold/50";
        document.getElementById('drinksSection').classList.remove('hidden');
        document.getElementById('foodSection').classList.add('hidden');
      } else {
        tabFood.className = "px-6 md:px-10 py-3 md:py-4 border text-[9px] md:text-[10px] uppercase tracking-[0.2em] md:tracking-[0.3em] font-black transition-all bg-jazz-gold text-black border-jazz-gold";
        tabDrinks.className = "px-6 md:px-10 py-3 md:py-4 border text-[9px] md:text-[10px] uppercase tracking-[0.2em] md:tracking-[0.3em] font-black transition-all bg-transparent text-white border-white/20 hover:border-jazz-gold/50";
        document.getElementById('foodSection').classList.remove('hidden');
        document.getElementById('drinksSection').classList.add('hidden');
      }
      
      renderContent();
    }

    function renderContent() {
      const t = menuData[currentLang];
      const sectionId = currentSection === 'drinks' ? 'drinksSection' : 'foodSection';
      const container = document.getElementById(sectionId);
      const data = currentSection === 'drinks' ? t.drinks : t.food;
      
      container.innerHTML = '';
      
      data.forEach(cat => {
        const catDiv = document.createElement('div');
        catDiv.className = "space-y-8 md:space-y-12";
        
        catDiv.innerHTML = `
          <div class="flex items-center gap-4 mb-8">
            <div class="h-[1px] w-8 md:w-12 bg-jazz-gold/40"></div>
            <h3 class="text-jazz-gold text-[10px] md:text-xs uppercase tracking-[0.4em] md:tracking-[0.6em] font-bold italic">${cat.name}</h3>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-12 md:gap-x-16 gap-y-10 md:gap-y-14">
            ${cat.items.map(item => `
              <div class="group">
                <div class="flex justify-between items-baseline gap-4 mb-2">
                  <h4 class="text-lg md:text-xl font-serif italic text-jazz-cream group-hover:text-jazz-gold transition-colors duration-300 leading-tight">${item.name}</h4>
                  <span class="text-[10px] md:text-[11px] text-jazz-gold/50 font-bold whitespace-nowrap">${item.price}</span>
                </div>
                <p class="text-[9px] md:text-[10px] text-white/30 uppercase tracking-widest leading-relaxed font-medium">${item.info}</p>
              </div>
            `).join('')}
          </div>
        `;
        
        container.appendChild(catDiv);
      });
    }

    // Initialize
    setLanguage('BG');
  </script>

</body>
</html>
